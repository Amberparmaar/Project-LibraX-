<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library Management System</title>
    <!-- bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- FontAwesome for Social and Contact Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <!-- custom css -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">

</head>

<body>
    
    <!-- Mobile Top Header -->

  <body>
    <!-- Fixed Mobile Top Header -->
    <div class="mobile-header">
      <div class="mobile-logo">
        <img src="../../images/logo3.png" alt="Logo" />
      </div>
      <button id="menuBtn" aria-label="Toggle Navigation">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>

    <!-- Mobile Overlay -->
    <div class="overlay" id="overlay"></div>

    <div class="dashboard container-fluid p-0">
      <div class="row g-0">
        <!-- Sidebar Container -->
        <div class="col-lg-2 sidebar" id="sidebar">
          <div class="logo desktop-logo">
            <img src="../images/logo3.png" alt="Logo" />
          </div>

          <div class="menu">
            <a href="#"><i class="fa-solid fa-house"></i> Dashboard</a>
            <a href="#"><i class="fa-solid fa-book"></i> Books</a>
            <a href="#"><i class="fa-solid fa-users"></i> Members</a>
            <a href="#"><i class="fa-solid fa-id-card"></i> Digital ID Cards</a>
            <a href="#"><i class="fa-solid fa-qrcode"></i> QR Scanner</a>
            <a href="#"><i class="fa-solid fa-book-open"></i> Issue Book</a>
            <a href="#"
              ><i class="fa-solid fa-arrow-rotate-left"></i> Return Book</a
            >
            <a href="#"><i class="fa-solid fa-chart-line"></i> Reports</a>
            <a href="#"><i class="fa-solid fa-gear"></i> Settings</a>
          </div>

          <div class="sidebar-footer">
            <hr />
            <a href="#" class="logout"
              ><i class="fa-solid fa-right-from-bracket"></i> Logout</a
            >
          </div>
        </div>

        <!-- Scrollable Main Workspace -->
        <div class="col-lg-10 blank-area"></div>
      </div>
    </div>

    <script>
      const menuBtn = document.getElementById("menuBtn");

      const sidebar = document.getElementById("sidebar");

      const overlay = document.getElementById("overlay");

      menuBtn.onclick = function () {
        sidebar.classList.toggle("show");

        overlay.classList.toggle("show");
      };

      overlay.onclick = function () {
        sidebar.classList.remove("show");

        overlay.classList.remove("show");
      };
    </script>

    <!-- bootstrape js -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
