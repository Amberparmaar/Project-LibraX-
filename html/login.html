<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
      <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- custom css -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
     <section class="login-section">

        <div class="container">

            <div class="row login-card align-items-center">

                <!-- Left Side -->

                <div class="col-lg-5">

                    <div class="form-box">
<div class="brand">

    <img src="../images/logo1.png" alt="LibraX Logo" class="logo-img">

</div>

                        <h2>Welcome Back!</h2>

                        <p>Login to your account</p>

                        <form>

                            <div class="mb-3">
                                <label>Email Address</label>

                                <input type="email" class="form-control"
                                    placeholder="Enter your email">
                            </div>

                            <div class="mb-3 password-box">

                                <label>Password</label>

                                <input type="password" class="form-control"
                                    placeholder="Enter your password">

                                <i class="bi bi-eye"></i>

                            </div>

                            <div
                                class="d-flex justify-content-between align-items-center mb-4">

                                <div>

                                    <input type="checkbox">

                                    <span>Remember me</span>

                                </div>

                                <a href="./forgetPassword.html">Forgot Password?</a>

                            </div>

                              <!-- ========button start=============  -->
               <div class="d-flex justify-content-center">
    <button class="animated-button" type="submit">
        <svg viewBox="0 0 24 24" class="arr-2" xmlns="http://www.w3.org/2000/svg">
            <path
                d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z">
            </path>
        </svg>

        <span class="text">Login</span>
        <span class="circle"></span>

        <svg viewBox="0 0 24 24" class="arr-1" xmlns="http://www.w3.org/2000/svg">
            <path
                d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z">
            </path>
        </svg>
    </button>
</div>
 <!-- ========button end=============  -->


                        </form>

                        <div class="text-center mt-4">

                            <p class="continue">Or continue with</p>

                            <div class="social-login">

                                <button class="social-btn">
                                    <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg">
                                </button>

                                <button class="social-btn">
                                    <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg">
                                </button>

                            </div>

                        </div>

                        <p class="register mt-4">
                            Don't have an account?
                            <a href="./ragister.html">Register here</a>
                        </p>

                    </div>

                </div>

                <!-- Right Side -->

                <div class="col-lg-7 d-none d-lg-block">

                    <div class="image-box">

                        <img src="../images/login.pnooo" alt="library" class="image-fluid">

                    </div>

                </div>

            </div>

        </div>

    </section>
      <!-- bootstrape js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
        <!-- gsap -->
         <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
    <!-- custom js -->
    <script src="./index.js"></script>

</body>
</html>
