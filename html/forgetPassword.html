<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password LibraX</title>

      <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- custom css -->
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<section class="forgot-section">

<div class="container">

<div class="row forgot-card align-items-center">

    <!-- Left Side -->

    <div class="col-lg-6">

        <div class="forgot-box">

           <div class="brand">

    <img src="../images/logo1.png" alt="LibraX Logo" class="logo-img">

   

</div>

            <h2>Forgot Password?</h2>

            <p>
                Don't worry! Enter your registered email address and we'll send you a password reset link.
            </p>

            <form>

                <div class="mb-4">

                    <label>Email Address</label>

                    <input type="email"
                        class="form-control"
                        placeholder="Enter your email">

                </div>

                <button class="btn reset-btn w-100">

                    Send Reset Link

                </button>

            </form>

            <div class="text-center mt-4">

                <a href="login.html">
                    <i class="bi bi-arrow-left"></i>
                    Back to Login
                </a>

            </div>

        </div>

    </div>

    <!-- Right Side -->

    <div class="col-lg-6 d-none d-lg-block">

        <div class="image-box">

            <img style="opacity: 1;" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT-mi18eyxOQQM0hoYC-xYRMxoiY0eHyr9heTOesEa3TjtmsjfVUL5HbGQc&s=10" alt="">

        </div>

    </div>

</div>

</div>

</section>

 <!-- bootstrape js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <!-- custom js -->
    <script src="./index.js"></script>
</body>

</html>
