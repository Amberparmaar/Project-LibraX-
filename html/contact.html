    <!-- ================= CONTACT SECTION START ================= -->

  <section class="contact-section">
    <div class="container">
        <div class="contact-card">
            <!-- Left Side: Info -->
            <div class="contact-info">
                <h2>Get In Touch</h2>
                <p>Have questions or need help?<br>We're here for you.</p>

                <div class="contact-item">
                    <i class="fa-solid fa-phone"></i>
                    <div>
                        <h6>Phone</h6>
                        <span>+92 300 1234567</span>
                    </div>
                </div>

                <div class="contact-item">
                    <i class="fa-solid fa-envelope"></i>
                    <div>
                        <h6>Email</h6>
                        <span>info@librax.com</span>
                    </div>
                </div>

                <div class="contact-item">
                    <i class="fa-solid fa-location-dot"></i>
                    <div>
                        <h6>Address</h6>
                        <span>University Road, City</span>
                    </div>
                </div>

                <div class="contact-item">
                    <i class="fa-solid fa-clock"></i>
                    <div>
                        <h6>Working Hours</h6>
                        <span>Mon - Fri (9:00 AM - 6:00 PM)</span>
                    </div>
                </div>
            </div>

            <!-- Right Side: Form -->
            <div class="contact-form">
                <h3>Send Us a Message</h3>
                <form action="#">
                    <input type="text" class="contact-input" placeholder="Your Name" required>
                    <input type="email" class="contact-input" placeholder="Your Email" required>
                    <input type="text" class="contact-input" placeholder="Subject" required>
                    <textarea class="contact-input message-box" placeholder="Message" required></textarea>

                    <!-- Submit Button Wrapper -->
                    <div class="btn-container">
                        <button class="animated-button" type="submit">
                            <svg viewBox="0 0 24 24" class="arr-2" xmlns="http://www.w3.org/2000/svg">
                                <path d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"></path>
                            </svg>
                            <span class="text">Send Message</span>
                            <span class="circle"></span>
                            <svg viewBox="0 0 24 24" class="arr-1" xmlns="http://www.w3.org/2000/svg">
                                <path d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"></path>
                            </svg>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

    <!-- ================= CONTACT SECTION END ================= -->
