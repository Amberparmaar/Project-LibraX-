    <!-- ================= BOOK DETAIL SECTION START ================= -->

    <!-- opacity: 0 => data load hone tak page hidden (JS showPage() se dikhayega) -->
    <main class="book-detail-page" style="opacity: 0">
      <!-- =========================
         BREADCRUMB
    ========================== -->
      <div class="breadcrumb">
        <a href="/index.html">Home</a>
        <i class="fa-solid fa-chevron-right"></i>

        <a href="./bookdetail.html">Books</a>
        <i class="fa-solid fa-chevron-right"></i>

        <span>Book Details</span>
      </div>

      <!-- =========================
         MAIN BOOK DETAIL AREA
    ========================== -->
      <section class="book-detail-container">
        <!-- =========================
             LEFT: BOOK GALLERY
        ========================== -->
        <div class="book-gallery">
          <!-- Main image area -->
          <div class="main-book-view">
            <!-- Best Seller Badge -->
            <span class="best-seller">
              <i class="fa-solid fa-star"></i>
              Best Seller
            </span>

            <!-- Previous button -->
            <button
              class="gallery-arrow gallery-prev"
              aria-label="Previous image"
            >
              <i class="fa-solid fa-chevron-left"></i>
            </button>

            <div class="main-cover">
              <img id="mainBookImage" alt="Book cover" />
            </div>

            <!-- Next button -->
            <button class="gallery-arrow gallery-next" aria-label="Next image">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>

          <!-- Gallery dots (JS fills these) -->
          <div class="gallery-dots"></div>

          <!-- Thumbnail row -->
          <div class="thumbnail-area">
            <button class="thumbnail-arrow">
              <i class="fa-solid fa-chevron-left"></i>
            </button>

            <!-- JS fills thumbnails -->
            <div class="thumbnails"></div>

            <button class="thumbnail-arrow">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>
        </div>

        <!-- =========================
             RIGHT: BOOK INFORMATION
        ========================== -->
        <div class="book-information">
          <!-- Stock status (JS fills) -->
          <span class="stock-badge"></span>

          <!-- Book title -->
          <h1 id="detailTitle"></h1>

          <!-- Subtitle -->
          <p class="book-subtitle" id="bookSubtitle"></p>

          <!-- Author / Year -->
          <div class="book-meta">
            <div class="meta-item">
              <i class="fa-regular fa-user"></i>
              <span id="detailAuthor"></span>
            </div>

            <div class="meta-divider"></div>

            <div class="meta-item">
              <i class="fa-regular fa-calendar"></i>
              <span id="bookYear"></span>
            </div>
          </div>

          <!-- =========================
                 BOOK BASIC INFORMATION
            ========================== -->
          <div class="book-basic-info">
            <div class="basic-item">
              <span class="basic-label">Category</span>
              <span class="basic-value category-value" id="bookCategory"></span>
            </div>

            <div class="basic-item">
              <span class="basic-label">Language</span>
              <span class="basic-value language-value" id="bookLanguage"></span>
            </div>

            <div class="basic-item">
              <span class="basic-label">ISBN</span>
              <span class="basic-value isbn-value" id="bookISBN"></span>
            </div>
          </div>

          <!-- =========================
                 AVAILABILITY CARDS
            ========================== -->
          <div class="availability-grid">
            <div class="dashboard-card" style="width: 140px">
              <div class="bg"></div>

              <div class="card-content">
                <div class="card-icon orange">
                  <i class="fa-solid fa-book-open" style="font-size: large"></i>
                </div>

                <div class="font-sm">
                  <p style="font-size: x-small">Total Copies</p>
                  <h6 class="orange"></h6>
                </div>
              </div>

              <div class="blob"></div>
            </div>

            <div class="dashboard-card" style="width: 140px">
              <div class="bg"></div>

              <div class="card-content">
                <div class="card-icon green">
                  <i class="fa-solid fa-check" style="font-size: large"></i>
                </div>

                <div class="font-sm">
                  <p style="font-size: x-small">Available</p>
                  <h6 class="green"></h6>
                </div>
              </div>

              <div class="blob"></div>
            </div>

            <div class="dashboard-card" style="width: 140px">
              <div class="bg"></div>

              <div class="card-content">
                <div class="card-icon red">
                  <i class="fa-solid fa-user" style="font-size: large"></i>
                </div>

                <div class="font-sm">
                  <p style="font-size: x-small">Issued</p>
                  <h6 class="red"></h6>
                </div>
              </div>

              <div class="blob"></div>
            </div>

            <div class="dashboard-card" style="width: 140px">
              <div class="bg"></div>

              <div class="card-content">
                <div class="card-icon blue">
                  <i class="fa-solid fa-book-open" style="font-size: large"></i>
                </div>

                <div class="font-sm">
                  <p style="font-size: x-small">Reserved</p>
                  <h6 class="blue"></h6>
                </div>
              </div>

              <div class="blob"></div>
            </div>
          </div>

          <!-- =========================
                 PRICE + RATING
            ========================== -->
          <div class="price-rating">
            <h2 id="bookPrice"></h2>

            <div class="rating">
              <div class="stars">
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star-half-stroke"></i>
              </div>

              <strong id="bookRating"></strong>
              <span id="reviewCount"></span>
            </div>
          </div>

          <!-- =========================
                 ACTION AREA
            ========================== -->
          <div class="book-actions">
            <!-- Quantity -->
            <div class="quantity-control">
              <button id="decreaseBtn" aria-label="Decrease quantity">
                <i class="fa-solid fa-minus"></i>
              </button>

              <span id="quantity">1</span>

              <button id="increaseBtn" aria-label="Increase quantity">
                <i class="fa-solid fa-plus"></i>
              </button>
            </div>

            <!-- Issue -->
            <button class="issue-btn" id="issueBookBtn">
              <i class="fa-solid fa-book-open"></i>
              Issue Book
            </button>

            <!-- Reserve -->
            <button class="reserve-btn" id="reserveBookBtn">
              <i class="fa-regular fa-bookmark"></i>
              Reserve Book
            </button>

            <!-- Favourite -->
            <button
              class="favorite-btn"
              id="favoriteBtn"
              aria-label="Add to favourites"
            >
              <i class="fa-regular fa-heart"></i>
            </button>
          </div>
        </div>
      </section>
    </main>
