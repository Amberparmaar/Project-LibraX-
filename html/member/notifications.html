<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- FontAwesome for Social and Contact Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- custom css -->
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">
</head>

<body>
    <!-- MOBILE HEADER -->
    <div class="mobile-header">
        <div class="mobile-logo">
            <img src="../../images/logo3.png" alt="Logo">
        </div>
        <button id="menuBtn" aria-label="Toggle Navigation">
            <i class="fa-solid fa-bars"></i>
        </button>
    </div>

    <div class="overlay" id="overlay"></div>

    <div class="dashboard container-fluid p-0">
        <div class="main-card">
            <div class="row g-0">

                <!-- SIDEBAR AREA -->
                <div class="col-lg-2 sidebar" id="sidebar">

                    <div class="logo desktop-logo">
                        <img src="../../images/logo3.png" alt="Logo">
                    </div>

                    <div class="menu">
                        <a href="../member/dashboard.html">
                            <i class="fa-solid fa-house"></i>
                            Dashboard
                        </a>

                        <a href="../member/my-books.html">
                            <i class="fa-solid fa-book"></i>
                            My Books
                        </a>

                        <a href="../member/ID-card.html">
                            <i class="fa-solid fa-id-card"></i>
                            Membership Cards
                        </a>

                        <a href="../member/notifications.html" class="active">
                            <i class="fa-solid fa-bell"></i>
                            Notifications
                        </a>

                        <a href="../member/setting-member.html">
                            <i class="fa-solid fa-gear"></i>
                            Settings
                        </a>
                    </div>

                    <div class="sidebar-footer">
                        <hr>
                        <a href="#" class="logout" id="logoutBtn">
                            <i class="fa-solid fa-right-from-bracket"></i>
                            Logout
                        </a>
                    </div>

                </div>

                <!-- WORKSPACE AREA -->
                <div class="col-lg-10 blank-area p-3 p-md-4">
                    
                    <!-- WRAPPER CONTAINER FOR NOTIFICATIONS -->
                    <div class="notifications-container p-3 p-md-4">
                        <!-- Static Header Static HTML Me Rahi Gi -->
                        <div class="d-flex align-items-center justify-content-between mb-4">
                            <h5 class="fw-bold mb-0 text-dark">Notifications</h5>
                        </div>

                        <!-- Real-time dynamic cards yahan lower side render honge -->
                        <div id="notificationsList"></div>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <!-- bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>

    <!-- Side Navigation Logic Toggle Script -->
    <script>
        const menuBtn = document.getElementById("menuBtn");
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");

        menuBtn.onclick = function () {
            sidebar.classList.toggle("show");
            overlay.classList.toggle("show");
        };

        overlay.onclick = function () {
            sidebar.classList.remove("show");
            overlay.classList.remove("show");
        };
    </script>
    <!-- Firebase JS Script -->
    <script type="module" src="../../JS/notifications.js"></script>

</body>

</html>
