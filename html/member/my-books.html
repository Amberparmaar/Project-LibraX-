<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- FontAwesome for Social and Contact Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- custom css -->
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">

</head>

<body>
    <!-- Mobile Top Header -->

    <div class="mobile-header">


        <div class="mobile-logo">

            <img src="../../images/logo3.png" alt="Logo">
        </div>



        <button id="menuBtn" aria-label="Toggle Navigation">
            <i class="fa-solid fa-bars"></i>
        </button>
    </div>

    <div class="overlay" id="overlay"></div>

    <div class="dashboard container-fluid p-0">
        <div class="main-card">
            <div class="row g-0">



                <!-- Sidebar -->


                <div class="col-lg-2 sidebar" id="sidebar">



                    <div class="logo desktop-logo">


                        <img src="../../images/logo3.png" alt="Logo">


                    </div>





                    <div class="menu">


                        <a href="#">

                            <i class="fa-solid fa-house"></i>

                            Dashboard

                        </a>



                        <a href="../member/my-books.html" class="active">

                            <i class="fa-solid fa-book"></i>

                            My Books

                        </a>

                        <a href="../member/ID-card.html">

                            <i class="fa-solid fa-id-card"></i>

                            Membership Cards

                        </a>



                        <a href="../member/notifications.html">

                            <i class="fa-solid fa-bell"></i>

                            Notifications

                        </a>



                        <a href="../member/setting-member.html">

                            <i class="fa-solid fa-gear"></i>

                            Settings

                        </a>



                    </div>



                    <div class="sidebar-footer">


                        <hr>


                        <a href="#" class="logout">

                            <i class="fa-solid fa-right-from-bracket"></i>

                            Logout

                        </a>


                    </div>

                </div>


                <!-- Blank Workspace -->


                <div class="col-lg-10 blank-area">

                    <div class="col-lg-10 col-12 blank-area p-4 w-100">

                        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white w-100">
                            <div class="table-responsive w-100">
                                <table class="table align-middle text-nowrap mb-0 w-100">
                                    <thead>
                                        <tr class="border-bottom">
                                            <th scope="col" class="py-3 px-3 fw-bold text-dark">Book</th>
                                            <th scope="col" class="py-3 px-3 fw-bold text-dark">Issue Date</th>
                                            <th scope="col" class="py-3 px-3 fw-bold text-dark">Due Date</th>
                                            <th scope="col" class="py-3 px-3 fw-bold text-dark">Status</th>
                                            <th scope="col" class="py-3 px-3 fw-bold text-dark">Fine</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td class="py-3 px-3 fw-bold text-secondary">Atomic Habits</td>
                                            <td class="py-3 px-3 text-secondary">10 May 2024</td>
                                            <td class="py-3 px-3 text-secondary">24 May 2024</td>
                                            <td class="py-3 px-3">
                                                <span
                                                    class="badge bg-success-subtle text-success fw-semibold px-3 py-2 rounded-2">Issued</span>
                                            </td>
                                            <td class="py-3 px-3 text-secondary">Rs. 0</td>
                                        </tr>
                                        <tr>
                                            <td class="py-3 px-3 fw-bold text-secondary">Deep Work</td>
                                            <td class="py-3 px-3 text-secondary">12 May 2024</td>
                                            <td class="py-3 px-3 text-secondary">26 May 2024</td>
                                            <td class="py-3 px-3">
                                                <span
                                                    class="badge bg-success-subtle text-success fw-semibold px-3 py-2 rounded-2">Issued</span>
                                            </td>
                                            <td class="py-3 px-3 text-secondary">Rs. 0</td>
                                        </tr>
                                        <tr>
                                            <td class="py-3 px-3 fw-bold text-secondary">The 5 AM Club</td>
                                            <td class="py-3 px-3 text-secondary">15 May 2024</td>
                                            <td class="py-3 px-3 text-secondary">29 May 2024</td>
                                            <td class="py-3 px-3">
                                                <span
                                                    class="badge bg-warning-subtle text-warning fw-semibold px-3 py-2 rounded-2">Due
                                                    Soon</span>
                                            </td>
                                            <td class="py-3 px-3 text-secondary">Rs. 0</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <!-- Footer Note -->
                            <div class="text-center pt-5 pb-3">
                                <p class="fst-italic text-secondary mb-0 fw-semibold">Note: Return books on time to
                                    avoid fine.</p>
                            </div>
                        </div>

                    </div>

                </div>


            </div>


        </div>


    </div>



    <script>


        const menuBtn = document.getElementById("menuBtn");

        const sidebar = document.getElementById("sidebar");

        const overlay = document.getElementById("overlay");



        menuBtn.onclick = function () {


            sidebar.classList.toggle("show");

            overlay.classList.toggle("show");


        }



        overlay.onclick = function () {


            sidebar.classList.remove("show");

            overlay.classList.remove("show");


        }



    </script>





    <!-- bootstrape js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>

</body>

</html>
