<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital ID-Card</title>
    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- FontAwesome for Social and Contact Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- custom css -->
     <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">
   

</head>

<body>

    <!-- MOBILE HEADER -->
    <div class="mobile-header">
        <div class="mobile-logo">
            <img src="../../images/logo3.png"  alt="Logo">
        </div>
        <button id="menuBtn" aria-label="Toggle Navigation">
            <i class="fa-solid fa-bars"></i>
        </button>
    </div>

    <div class="overlay" id="overlay"></div>

    <div class="dashboard container-fluid p-0">
        <div class="main-card">
            <div class="row g-0">


                <div class="col-lg-2 sidebar" id="sidebar">



                    <div class="logo desktop-logo">


                        <img src="../../images/logo3.png" alt="Logo">


                    </div>





                    <div class="menu">


                        <a href="../member/member-dashboard.html">

                            <i class="fa-solid fa-house"></i>

                            Dashboard

                        </a>



                        <a href="../member/my-books.html">

                            <i class="fa-solid fa-book"></i>

                            My Books

                        </a>

                        <a href="../member/ID-card.html" class="active">

                            <i class="fa-solid fa-id-card"></i>

                            Membership Cards

                        </a>



                        <a href="../member/notifications.html">

                            <i class="fa-solid fa-bell"></i>

                            Notifications

                        </a>



                        <a href="../member/setting-member.html">

                            <i class="fa-solid fa-gear"></i>

                            Settings

                        </a>



                    </div>



                    <div class="sidebar-footer">


                        <hr>


                        <a href="#" class="logout">

                            <i class="fa-solid fa-right-from-bracket"></i>

                            Logout

                        </a>


                    </div>

                </div>


                <!-- WORKSPACE AREA / MAIN CONTAINER -->
                <div
                    class="col-12 col-lg-10 blank-area pt-5 pt-lg-0 p-3 p-md-5 d-flex align-items-center justify-content-center min-vh-100">
                    <!-- ID Card Container -->
                    <div class="d-flex flex-column align-items-center w-100" style="max-width: 680px;">

                        <!-- ID CARD CONTAINER -->
                        <div
                            class="card w-100 border border-light-subtle shadow-sm rounded-4 overflow-hidden bg-white mb-4">

                            <!-- CARD HEADER -->
                            <div class="p-3 text-white d-flex align-items-center gap-3"
                                style="background-color: #0045c4;">
                                <img src="../../images/logo2.png" alt="LibraX Logo"
                                    style="width: 50px; height: 50px; object-fit: contain;">
                                <div class="d-flex flex-column justify-content-center">
                                    <h4 class="m-0 fw-bold lh-1" style="font-size: 1.5rem; letter-spacing: 0.5px;">
                                        LibraX</h4>
                                    <p class="m-0 opacity-75 mt-1" style="font-size: 0.75rem; font-weight: 500; color: #fcfdfe;">Digital
                                        Library ID Card</p>
                                </div>
                            </div>

                            <!-- CARD BODY -->
                            <div class="card-body p-4 position-relative" style="background-color: #fcfdfe;">
                                <div class="row align-items-center g-4">

                                    <!-- Profile Image Column -->
                                    <div class="col-12 col-sm-4 text-center">
                                        <img src="https://via.placeholder.com/160x42/06285c/ffffff?text=LibraX"
                                            alt="Profile"
                                            class="rounded-circle img-fluid border border-3 border-white shadow-sm"
                                            style="width: 140px; height: 140px; object-fit: cover;">
                                    </div>

                                    <!-- Info Details Column -->
                                    <div class="col-12 col-sm-4 text-sm-start text-center">
                                        <div class="mb-2">
                                            <small class="text-muted d-block" style="font-size: 0.7rem;">Name</small>
                                            <span class="fw-bold text-dark fs-5">Ali Raza</span>
                                        </div>
                                        <div class="mb-2">
                                            <small class="text-muted d-block" style="font-size: 0.7rem;">Member
                                                ID</small>
                                            <span class="fw-bold text-dark">M001</span>
                                        </div>
                                        <div class="mb-2">
                                            <small class="text-muted d-block"
                                                style="font-size: 0.7rem;">Department</small>
                                            <span class="fw-semibold text-secondary"
                                                style="font-size: 0.95rem;">Computer Science</span>
                                        </div>
                                        <div class="mb-2">
                                            <small class="text-muted d-block" style="font-size: 0.7rem;">Email</small>
                                            <span class="text-secondary"
                                                style="font-size: 0.85rem;">ali@example.com</span>
                                        </div>
                                        <div class="mb-2">
                                            <small class="text-muted d-block" style="font-size: 0.7rem;">Phone</small>
                                            <span class="text-secondary" style="font-size: 0.85rem;">+92 300
                                                1234567</span>
                                        </div>
                                        <div class="mb-2">
                                            <small class="text-muted d-block" style="font-size: 0.7rem;">Join
                                                Date</small>
                                            <span class="text-secondary" style="font-size: 0.85rem;">15 May 2024</span>
                                        </div>
                                        <div>
                                            <span class="text-success fw-bold" style="font-size: 0.85rem;">Active
                                                Member</span>
                                        </div>
                                    </div>

                                    <!-- QR Code Column -->
                                    <div class="col-12 col-sm-4 text-center d-flex flex-column align-items-center">
                                        <div class="p-3 bg-white rounded-3 border border-light-subtle text-center shadow-sm w-100"
                                            style="max-width: 175px;">
                                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=LibraX-M001"
                                                alt="QR Code" class="img-fluid mb-2 w-100">
                                            <p class="m-0 text-muted lh-sm" style="font-size: 0.75rem;">Scan to verify
                                                membership</p>
                                        </div>
                                    </div>

                                </div>
                            </div>

                            <!-- CARD FOOTER (BARCODE) -->
                            <div class="p-3 bg-white border-top border-light-subtle text-center">
                                <div class="d-flex justify-content-center align-items-center">
                                    <img src="https://th.bing.com/th/id/OIP.pgPqbmFjuXS9Q8a9eA88WQHaCu?r=0&o=7rm=3&rs=1&pid=ImgDetMain&o=7&rm=3"
                                        alt="Barcode" class="img-fluid"
                                        style="height: 38px; width: 85%; object-fit: fill;">
                                </div>
                            </div>

                        </div>

                        <!-- ACTION BUTTONS -->
                        <div class="d-flex gap-3 w-100 justify-content-center flex-column flex-sm-row px-2">
                            <button
                                class="btn btn-primary px-4 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2 rounded-3 shadow-sm flex-fill flex-sm-grow-0"
                                style="background-color: #2563EB; border-color: #2563EB;">
                                <i class="fa-solid fa-download"></i> Download Card (PDF)
                            </button>
                            <button
                                class="btn btn-outline-secondary bg-white px-4 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2 rounded-3 shadow-sm flex-fill flex-sm-grow-0 text-dark border-light-subtle">
                                <i class="fa-solid fa-print text-secondary"></i> Print Card
                            </button>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>




    <!-- bootstrape js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>


    <!-- Side Navigation Logic Toggle Script -->
    <script>
        const menuBtn = document.getElementById("menuBtn");
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");

        menuBtn.onclick = function () {
            sidebar.classList.toggle("show");
            overlay.classList.toggle("show");
        };

        overlay.onclick = function () {
            sidebar.classList.remove("show");
            overlay.classList.remove("show");
        };
    </script>

</body>

</html>
