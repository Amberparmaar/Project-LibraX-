<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Members Management</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />
  </head>

  <body>
    <!-- Mobile Top Header -->
    <div class="mobile-header">
      <div class="mobile-logo">
        <img src="../../images/logo3.png" alt="Logo" />
      </div>
      <button id="menuBtn" aria-label="Toggle Navigation">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>

    <!-- Mobile Overlay -->
    <div class="overlay" id="overlay"></div>

    <div class="dashboard container-fluid p-0">
      <div class="row g-0">
        <!-- Sidebar -->
        <div class="col-lg-2 sidebar" id="sidebar">
          <div class="logo desktop-logo">
            <img src="../../images/logo3.png" alt="Logo" class="logo-img" />
          </div>

          <div class="menu">
            <a href="./member-dashboard.html">
              <i class="fa-solid fa-house"></i> Dashboard
            </a>
            <a href="../admin/books.html">
              <i class="fa-solid fa-book"></i> Books
            </a>
            <a href="#" class="active">
              <i class="fa-solid fa-users"></i> Members
            </a>
            <a href="#"><i class="fa-solid fa-id-card"></i> Digital ID Cards</a>
            <a href="#"><i class="fa-solid fa-qrcode"></i> QR Scanner</a>
            <a href="#"><i class="fa-solid fa-book-open"></i> Issue Book</a>
            <a href="#"
              ><i class="fa-solid fa-arrow-rotate-left"></i> Return Book</a
            >

            <a href="#"><i class="fa-solid fa-gear"></i> Settings</a>
          </div>

          <div class="sidebar-footer">
            <hr />
            <a href="#" class="logout" id="logoutBtn">
              <i class="fa-solid fa-right-from-bracket"></i> Logout
            </a>
          </div>
        </div>

        <!-- Main Content -->
        <div class="col-lg-10 blank-area" style="padding: 40px">
          <!-- Top Header -->
          <div
            class="content-header d-flex justify-content-between align-items-center mb-4"
          >
            <div>
              <h2>Members Management</h2>
            </div>

            <button
              type="button"
              class="animated-button nav-btn"
              data-bs-toggle="modal"
              data-bs-target="#addBookModal"
              id="openMemberModalBtn"
            >
              <svg
                viewBox="0 0 24 24"
                class="arr-2"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"
                />
              </svg>

              <span class="btn-text">Add Member</span>

              <span class="circle"></span>

              <svg
                viewBox="0 0 24 24"
                class="arr-1"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 18.3638L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"
                />
              </svg>
            </button>
          </div>

          <!-- Search and Filter -->
          <div class="search-filter d-flex gap-3 mb-4">
            <div class="search-box flex-grow-1 position-relative">
              <i
                class="fa-solid fa-magnifying-glass position-absolute top-50 start-0 translate-middle-y ms-3"
              ></i>
              <input
                type="text"
                id="memberSearchInput"
                class="form-control ps-5"
                placeholder="Search members by name, email, department..."
              />
            </div>

            <select
              id="memberStatusFilter"
              class="filter-btn form-select w-auto"
            >
              <option value="all">All Status</option>
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>

          <!-- Members Table -->
          <div class="table-card">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>Member ID</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Contact</th>
                  <th>Department</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="memberTableBody">
                <!-- Registered members dynamic render honge yahan -->
              </tbody>
            </table>

            <!-- Bottom Pagination -->
            <div
              class="table-footer d-flex justify-content-between align-items-center mt-3"
            >
              <p id="memberResultText" class="m-0">Showing 0 members</p>

              <div class="pagination d-flex gap-1" id="memberPagination"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Add/Edit Member Modal -->
    <div
      class="modal fade"
      id="memberFormModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <form id="memberForm">
            <div class="modal-header">
              <h5 class="modal-title" id="memberModalTitle">Add New Member</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="memberDocumentId" />

              <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input
                  type="text"
                  id="memberNameInput"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input
                  type="email"
                  id="memberEmailInput"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Contact / Phone</label>
                <input
                  type="text"
                  id="memberPhoneInput"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Department</label>
                <input
                  type="text"
                  id="memberDepartmentInput"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Status</label>
                <select id="memberStatusInput" class="form-select" required>
                  <option value="Active">Active</option>
                  <option value="Inactive">Inactive</option>
                </select>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" id="memberSaveBtn" class="btn btn-primary">
                Save Member
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Mobile Sidebar Script -->
    <script>
      const menuBtn = document.getElementById("menuBtn");
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");

      if (menuBtn) {
        menuBtn.onclick = function () {
          sidebar.classList.toggle("show");
          overlay.classList.toggle("show");
        };
      }

      if (overlay) {
        overlay.onclick = function () {
          sidebar.classList.remove("show");
          overlay.classList.remove("show");
        };
      }
    </script>
    <!-- GSAP Plugins -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>

    <!-- GSAP Animation Script -->
    <script src="../../JS/animation.js"></script>
    <script type="module" src="../../JS/auth.js"></script>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../../JS/auth.js"></script>
    <script type="module" src="../../JS/members.js"></script>
  </body>
</html>
