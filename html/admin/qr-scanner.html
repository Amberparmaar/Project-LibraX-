<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR-Scanner</title>
    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- FontAwesome for Social and Contact Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- custom css -->
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">

</head>

<body>


    <!-- MOBILE HEADER -->
    <div class="mobile-header">
        <div class="mobile-logo">
            <!-- Replaced with a reliable placeholder logo so you can preview layout structure immediately -->
            <img src="https://via.placeholder.com/120x38/06285c/ffffff?text=LibraX" alt="Logo">
        </div>
        <button id="menuBtn" aria-label="Toggle Navigation">
            <i class="fa-solid fa-bars"></i>
        </button>
    </div>

    <div class="overlay" id="overlay"></div>

    <div class="dashboard container-fluid p-0">
        <div class="main-card">
            <div class="row g-0">

                <!-- SIDEBAR -->
                <div class="col-lg-2 sidebar" id="sidebar">
                    <div class="logo desktop-logo">
                        <img src="../../images/logo3.png" alt="Logo">
                    </div>


                    <div class="menu">


                        <a href="#">

                            <i class="fa-solid fa-house"></i>

                            Dashboard

                        </a>



                        <a href="../member/my-books.html">

                            <i class="fa-solid fa-book"></i>

                            My Books

                        </a>

                        <a href="../member/ID-card.html">

                            <i class="fa-solid fa-id-card"></i>

                            Membership Cards

                        </a>


                        <a href="../member/setting-member.html" class="active">

                            <i class="fa-solid fa-gear"></i>

                            Settings

                        </a>



                    </div>



                    <div class="sidebar-footer">


                        <hr>


                        <a href="#" class="logout">

                            <i class="fa-solid fa-right-from-bracket"></i>

                            Logout

                        </a>


                    </div>

                </div>

                <!-- WORKSPACE AREA -->
                <div class="col-lg-10 blank-area">
                    <div class="container-fluid p-4">
                        <div class="row g-4">

                            <!-- Left Side: Scan QR Code Card -->
                            <div class="col-12 col-md-5 col-xl-4">
                                <div class="card border-0 bg-white rounded-4 p-4 shadow-sm">
                                    <h5 class="fw-bold mb-4 text-dark" style="color: #06285c !important;">Scan QR Code
                                    </h5>

                                    <!-- Scanner Box UI Component -->
                                    <div class="scanner-view mb-4 shadow-sm">
                                        <div class="corner top-left"></div>
                                        <div class="corner top-right"></div>
                                        <div class="corner bottom-left"></div>
                                        <div class="corner bottom-right"></div>
                                    </div>

                                    <!-- Scan Trigger Button -->
                                    <div class="text-center w-100">
                                        <button class="btn btn-primary px-4 py-2-5 w-100 fw-medium rounded-3"
                                            style="background-color: #2563EB; border: none; padding: 12px;">
                                            <i class="fa-solid fa-qrcode me-2"></i> Start Scanner
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!-- Right Side: Scan Result Information Container -->
                            <div class="col-12 col-md-7 col-xl-8">
                                <div class="card border-0 bg-white rounded-4 p-4 shadow-sm">
                                    <h5 class="fw-bold mb-4 text-dark" style="color: #06285c !important;">Scan Result
                                    </h5>

                                    <!-- Member Details Wrapper -->
                                    <div class="d-flex align-items-center gap-3 mb-4">
                                        <img src="https://via.placeholder.com/120x38/06285c/ffffff?text=LibraX"
                                            alt="Member Photo" class="member-profile-img">
                                        <div>
                                            <h4 class="mb-1 fw-bold text-dark" style="color: #06285c !important;">Ali
                                                Raza</h4>
                                            <div class="fw-semibold text-primary mb-2"
                                                style="color: #2563EB !important;">M001</div>
                                            <span class="badge-active">Active Member</span>
                                        </div>
                                    </div>

                                    <!-- Profile Data Rows -->
                                    <div class="container-fluid p-0 mb-4">
                                        <div class="row info-row border-bottom g-0">
                                            <div class="col-6 info-label">Department</div>
                                            <div class="col-6 info-value">Computer Science</div>
                                        </div>
                                        <div class="row info-row border-bottom g-0">
                                            <div class="col-6 info-label">Email</div>
                                            <div class="col-6 info-value text-truncate">ali@example.com</div>
                                        </div>
                                        <div class="row info-row border-bottom g-0">
                                            <div class="col-6 info-label">Phone</div>
                                            <div class="col-6 info-value">+92 300 1234567</div>
                                        </div>
                                        <div class="row info-row border-bottom g-0">
                                            <div class="col-6 info-label">Books Borrowed</div>
                                            <div class="col-6 info-value">2</div>
                                        </div>
                                        <div class="row info-row border-bottom g-0">
                                            <div class="col-6 info-label">Overdue Books</div>
                                            <div class="col-6 info-value text-danger fw-bold">0</div>
                                        </div>
                                        <div class="row info-row g-0 pt-2">
                                            <div class="col-6 info-label">Total Fine</div>
                                            <div class="col-6 info-value text-danger fw-bold">Rs. 0</div>
                                        </div>
                                    </div>

                                    <!-- Action Trigger Action Button -->
                                    <div class="w-100">
                                        <button class="btn btn-primary w-100 py-2-5 fw-medium rounded-3"
                                            style="background-color: #2563EB; border: none; padding: 12px;">
                                            <i class="fa-solid fa-book-bookmark me-2"></i> Issue Book
                                        </button>
                                    </div>

                                </div>
                            </div>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <!-- bootstrape js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>

    <!-- Side Navigation Logic Toggle Script -->
    <script>
        const menuBtn = document.getElementById("menuBtn");
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");

        menuBtn.onclick = function () {
            sidebar.classList.toggle("show");
            overlay.classList.toggle("show");
        };

        overlay.onclick = function () {
            sidebar.classList.remove("show");
            overlay.classList.remove("show");
        };
    </script>

</body>

</html>
