<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Return Book</title>
    <!-- bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- FontAwesome for Social and Contact Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <!-- custom css -->
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />
  </head>

  <body>
    <!-- MOBILE HEADER -->
    <div class="mobile-header">
      <div class="mobile-logo">
        <img src="../../images/logo3.png" alt="Logo" />
      </div>
      <button id="menuBtn" aria-label="Toggle Navigation">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>

    <div class="overlay" id="overlay"></div>

    <div class="dashboard container-fluid p-0">
      <div class="main-card">
        <div class="row g-0">
          <!-- SIDEBAR -->
          <div class="col-lg-2 sidebar" id="sidebar">
            <div class="logo desktop-logo">
              <img src="../../images/logo3.png" alt="Logo" />
            </div>

            <div class="menu">
              <a href="#"><i class="fa-solid fa-house"></i> Dashboard</a>
              <a href="#"><i class="fa-solid fa-book"></i> Books</a>
              <a href="#"><i class="fa-solid fa-users"></i> Members</a>
              <a href="../admin/qr-scanner.html"
                ><i class="fa-solid fa-qrcode"></i> QR Scanner</a
              >
              <a href="../admin/issue-book.html"
                ><i class="fa-solid fa-book-open"></i> Issue Book</a
              >
              <a href="../admin/return-book.html" class="active"
                ><i class="fa-solid fa-arrow-rotate-left"></i> Return Book</a
              >
              <a href="../admin/setting.html"
                ><i class="fa-solid fa-gear"></i> Settings</a
              >
            </div>

            <div class="sidebar-footer">
              <hr />
              <a href="#" class="logout" id="logoutBtn"
                ><i class="fa-solid fa-right-from-bracket"></i> Logout</a
              >
            </div>
          </div>

          <!-- WORKSPACE AREA -->
          <div class="col-lg-10 blank-area">
            <div class="workspace-container">
              <!-- Alert Message Placeholder -->
              <div id="returnMessage"></div>

              <!-- Table Card wrapper -->
              <div class="table-card">
                <!-- Title & Search Bar Area -->
                <div class="row align-items-center mb-4 gy-3">
                  <div class="col-sm-6">
                    <h1 class="page-title">Return Book</h1>
                  </div>
                  <div class="col-sm-6 d-flex justify-content-sm-end">
                    <div class="search-wrapper">
                      <i class="fa-solid fa-magnifying-glass"></i>
                      <input
                        type="text"
                        id="searchInput"
                        class="form-control search-input"
                        placeholder="Search by member ID, name, or book..."
                      />
                    </div>
                  </div>
                </div>

                <!-- Responsive Table Container -->
                <div class="table-responsive">
                  <table class="table custom-table table-borderless">
                    <thead>
                      <tr>
                        <th>Member</th>
                        <th>Book Title</th>
                        <th>Issue Date</th>
                        <th>Due Date</th>
                        <th>Fine</th>
                        <th>Status</th>
                        <th class="text-end">Action</th>
                      </tr>
                    </thead>
                    <!-- Dynamic Rows target via id -->
                    <tbody id="returnBooksTable">
                      <tr>
                        <td colspan="7" class="text-center text-secondary py-4">
                          Loading issued books...
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>

              <!-- Summary KPI Cards -->
              <div class="row g-4 mt-5">
                <div class="col-md-6">
                  <div class="kpi-card">
                    <h2 class="kpi-title">Total Overdue Books</h2>
                    <p class="kpi-value" id="totalOverdueBooks">0</p>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="kpi-card">
                    <h2 class="kpi-title">Total Fine Calculated</h2>
                    <p class="kpi-value" id="totalFineCollected">Rs. 0</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- bootstrap js -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
    <!-- GSAP Plugins -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>

    <!-- GSAP Animation Script -->
    <script src="../../JS/animation.js"></script>
    <script type="module" src="../../JS/auth.js"></script>
    <script type="module" src="../../JS/return-book.js"></script>
  </body>
</html>
