<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Return Book</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">

</head>


<body>

    <!-- MOBILE HEADER -->
    <div class="mobile-header">

        <div class="mobile-logo">

            <img src="../../images/logo3.png" alt="Logo">

        </div>

        <button id="menuBtn" aria-label="Toggle Navigation">

            <i class="fa-solid fa-bars"></i>

        </button>

    </div>


    <div class="overlay" id="overlay"></div>


    <div class="dashboard container-fluid p-0">

        <div class="main-card">

            <div class="row g-0">


                <!-- SIDEBAR -->
                <div class="col-lg-2 sidebar" id="sidebar">

                    <div class="logo desktop-logo">

                        <img src="../../images/logo3.png" alt="Logo">

                    </div>


                    <div class="menu">

                        <a href="#">
                            <i class="fa-solid fa-house"></i>
                            Dashboard
                        </a>

                        <a href="#">
                            <i class="fa-solid fa-book"></i>
                            Books
                        </a>

                        <a href="#">
                            <i class="fa-solid fa-users"></i>
                            Members
                        </a>

                        <a href="../admin/qr-scanner.html">
                            <i class="fa-solid fa-qrcode"></i>
                            QR Scanner
                        </a>

                        <a href="../admin/issue-book.html">
                            <i class="fa-solid fa-book-open"></i>
                            Issue Book
                        </a>

                        <a href="../admin/return-book.html"
                            class="active">

                            <i class="fa-solid fa-arrow-rotate-left"></i>

                            Return Book

                        </a>

                        <a href="../admin/Reports.html">

                            <i class="fa-solid fa-chart-line"></i>

                            Reports

                        </a>

                        <a href="../admin/setting.html">

                            <i class="fa-solid fa-gear"></i>

                            Settings

                        </a>

                    </div>


                    <div class="sidebar-footer">

                        <hr>

                        <a href="#" class="logout">

                            <i class="fa-solid fa-right-from-bracket"></i>

                            Logout

                        </a>

                    </div>

                </div>


                <!-- WORKSPACE -->
                <div class="col-lg-10 blank-area">

                    <div class="workspace-container">


                        <!-- TABLE CARD -->
                        <div class="table-card">


                            <!-- TITLE + SEARCH -->
                            <div class="row align-items-center mb-4 gy-3">

                                <div class="col-sm-6">

                                    <h1 class="page-title">
                                        Return Book
                                    </h1>

                                </div>


                                <div class="col-sm-6 d-flex justify-content-sm-end">

                                    <div class="search-wrapper">

                                        <i class="fa-solid fa-magnifying-glass"></i>

                                        <input type="text"
                                            id="searchInput"
                                            class="form-control search-input"
                                            placeholder="Search by member ID or name...">

                                    </div>

                                </div>

                            </div>


                            <!-- MESSAGE -->
                            <div id="returnMessage"></div>


                            <!-- TABLE -->
                            <div class="table-responsive">

                                <table class="table custom-table table-borderless">

                                    <thead>

                                        <tr>

                                            <th>
                                                Member
                                            </th>

                                            <th>
                                                Book Title
                                            </th>

                                            <th>
                                                Issue Date
                                            </th>

                                            <th>
                                                Due Date
                                            </th>

                                            <th>
                                                Fine
                                            </th>

                                            <th>
                                                Status
                                            </th>

                                            <th class="text-end">
                                                Action
                                            </th>

                                        </tr>

                                    </thead>


                                    <tbody id="returnBooksTable">

                                        <tr>

                                            <td colspan="7"
                                                class="text-center text-secondary py-4">

                                                Loading...

                                            </td>

                                        </tr>

                                    </tbody>

                                </table>

                            </div>

                        </div>


                        <!-- SUMMARY KPI CARDS -->
                        <div class="row g-4">


                            <!-- TOTAL OVERDUE -->
                            <div class="col-md-6">

                                <div class="kpi-card">

                                    <h2 class="kpi-title">
                                        Total Overdue Books
                                    </h2>

                                    <p class="kpi-value"
                                        id="totalOverdueBooks">

                                        0

                                    </p>

                                </div>

                            </div>


                            <!-- TOTAL FINE -->
                            <div class="col-md-6">

                                <div class="kpi-card">

                                    <h2 class="kpi-title">
                                        Total Fine Collected
                                    </h2>

                                    <p class="kpi-value"
                                        id="totalFineCollected">

                                        Rs. 0

                                    </p>

                                </div>

                            </div>


                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>


    <!-- Dynamic Return Book JS -->
    <script type="module"
        src="../../JS/return-book.js"></script>

</body>

</html>
