<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Issue Book</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Flatpickr -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">

</head>

<body>

    <!-- MOBILE HEADER -->
    <div class="mobile-header">

        <div class="mobile-logo">
            <img src="../../images/logo3.png" alt="Logo">
        </div>

        <button id="menuBtn" aria-label="Toggle Navigation">
            <i class="fa-solid fa-bars"></i>
        </button>

    </div>

    <div class="overlay" id="overlay"></div>


    <div class="dashboard container-fluid p-0">

        <div class="main-card">

            <div class="row g-0">

                <!-- SIDEBAR -->
                <div class="col-lg-2 sidebar" id="sidebar">

                    <div class="logo desktop-logo">
                        <img src="../../images/logo3.png" alt="Logo">
                    </div>

                    <div class="menu">

                        <a href="#">
                            <i class="fa-solid fa-house"></i>
                            Dashboard
                        </a>

                        <a href="#">
                            <i class="fa-solid fa-book"></i>
                            Books
                        </a>

                        <a href="#">
                            <i class="fa-solid fa-users"></i>
                            Members
                        </a>

                        <a href="../admin/qr-scanner.html">
                            <i class="fa-solid fa-qrcode"></i>
                            QR Scanner
                        </a>

                        <a href="../admin/issue-book.html" class="active">
                            <i class="fa-solid fa-book-open"></i>
                            Issue Book
                        </a>

                        <a href="../admin/return-book.html">
                            <i class="fa-solid fa-arrow-rotate-left"></i>
                            Return Book
                        </a>

                        <a href="../admin/issue-book.html">
                            <i class="fa-solid fa-chart-line"></i>
                            Reports
                        </a>

                        <a href="../admin/setting.html">
                            <i class="fa-solid fa-gear"></i>
                            Settings
                        </a>

                    </div>

                    <div class="sidebar-footer">

                        <hr>

                        <a href="#" class="logout">
                            <i class="fa-solid fa-right-from-bracket"></i>
                            Logout
                        </a>

                    </div>

                </div>


                <!-- WORKSPACE -->
                <div class="col-lg-10 blank-area">

                    <div class="issue-book-container">

                        <div class="issue-card">

                            <h1 class="card-title">
                                Issue Book
                            </h1>


                            <!-- ISSUE FORM -->
                            <form id="issueBookForm" class="row g-4">

                                <!-- LEFT COLUMN -->
                                <div class="col-lg-7">

                                    <div class="row g-3">

                                        <!-- MEMBER -->
                                        <div class="col-12 form-group">

                                            <label for="selectMember">
                                                Select Member
                                            </label>

                                            <select class="form-select"
                                                id="selectMember"
                                                required>

                                                <option value="">
                                                    Loading members...
                                                </option>

                                            </select>

                                        </div>


                                        <!-- BOOK -->
                                        <div class="col-12 form-group">

                                            <label for="selectBook">
                                                Select Book
                                            </label>

                                            <select class="form-select"
                                                id="selectBook"
                                                required>

                                                <option value="">
                                                    Loading available books...
                                                </option>

                                            </select>

                                        </div>


                                        <!-- ISSUE DATE -->
                                        <div class="col-md-6 form-group">

                                            <label for="issueDate">
                                                Issue Date
                                            </label>

                                            <div class="input-group">

                                                <input type="text"
                                                    class="form-control"
                                                    id="issueDate"
                                                    placeholder="DD/MM/YYYY"
                                                    required>

                                                <span class="input-group-text"
                                                    id="issueDateIcon">

                                                    <i class="fa-regular fa-calendar text-secondary"></i>

                                                </span>

                                            </div>

                                        </div>


                                        <!-- RETURN DATE -->
                                        <div class="col-md-6 form-group">

                                            <label for="returnDate">
                                                Return Date
                                            </label>

                                            <div class="input-group">

                                                <input type="text"
                                                    class="form-control"
                                                    id="returnDate"
                                                    placeholder="DD/MM/YYYY"
                                                    required>

                                                <span class="input-group-text"
                                                    id="returnDateIcon">

                                                    <i class="fa-regular fa-calendar text-secondary"></i>

                                                </span>

                                            </div>

                                        </div>


                                        <!-- REMARKS -->
                                        <div class="col-12 form-group">

                                            <label for="remarks">
                                                Remarks (Optional)
                                            </label>

                                            <textarea class="form-control"
                                                id="remarks"
                                                rows="3"
                                                placeholder="Enter remarks..."></textarea>

                                        </div>


                                        <!-- MESSAGE -->
                                        <div class="col-12">

                                            <div id="issueMessage"></div>

                                        </div>


                                        <!-- BUTTON -->
                                        <div class="col-12">

                                            <button type="submit"
                                                class="btn btn-issue"
                                                id="issueBtn">

                                                Issue Book

                                            </button>

                                        </div>

                                    </div>

                                </div>


                                <!-- RIGHT COLUMN -->
                                <div class="col-lg-5">

                                    <div class="member-info-card">

                                        <h2 class="panel-title">
                                            Member Info
                                        </h2>


                                        <!-- MEMBER PROFILE -->
                                        <div class="member-profile d-flex align-items-center gap-3 pb-3 border-bottom mb-3">

                                         <img id="memberAvatar" src="https://ui-avatars.com/api/?name=User&background=6c757d&color=fff" alt="Member Avatar">

                                                <h3 class="member-name"
                                                    id="memberName">
                                                    Select Member
                                                </h3>

                                                <p class="member-id mb-1"
                                                    id="memberId">
                                                    —
                                                </p>

                                                <p class="member-dept mb-0"
                                                    id="memberDept">
                                                    —
                                                </p>

                                            </div>

                                        </div>


                                        <!-- BORROWED STATS -->
                                        <div class="borrowed-stats">

                                            <div class="d-flex align-items-center justify-content-between stats-item border-bottom mb-3">

                                                <span class="stats-label">
                                                    Books Currently Borrowed
                                                </span>

                                                <span class="stats-value"
                                                    id="borrowedCount">
                                                    0
                                                </span>

                                            </div>


                                            <div class="d-flex align-items-center justify-content-between stats-item">

                                                <span class="stats-label">
                                                    Overdue Books
                                                </span>

                                                <span class="stats-value text-fine"
                                                    id="overdueCount">
                                                    0
                                                </span>

                                            </div>

                                        </div>

                                    </div>

                                </div>

                            </form>


                            <!-- RECENT ISSUED BOOKS -->
                            <div class="issued-table-card mt-4">

                                <div class="table-responsive">

                                    <table class="table custom-issued-table align-middle mb-0">

                                        <thead>

                                            <tr>
                                                <th>Book</th>
                                                <th>Member</th>
                                                <th>Issue Date</th>
                                                <th>Return Date</th>
                                                <th class="text-center">Status</th>
                                            </tr>

                                        </thead>

                                        <tbody id="issuedBooksTable">

                                            <tr>

                                                <td colspan="5"
                                                    class="text-center text-secondary py-4">

                                                    Loading...

                                                </td>

                                            </tr>

                                        </tbody>

                                    </table>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>

     <!-- Side Navigation Logic Toggle Script -->
    <script>
        const menuBtn = document.getElementById("menuBtn");
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");

        menuBtn.onclick = function () {
            sidebar.classList.toggle("show");
            overlay.classList.toggle("show");
        };

        overlay.onclick = function () {
            sidebar.classList.remove("show");
            overlay.classList.remove("show");
        };
    </script>
    <!-- Flatpickr -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>


    <!-- ALL FUNCTIONALITY -->
    <script type="module" src="../../JS/issue-book.js"></script>

</body>

</html>
