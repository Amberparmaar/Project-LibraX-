<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LibraX Register</title>

       <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- custom css -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<section class="register-section">

<div class="container">

<div class="register-card">

<div class="d-flex justify-content-between align-items-start flex-wrap mb-4">

<div>

<div class="brand">

    <img src="../assets/images/logo1.png" alt="LibraX Logo" class="logo-img">


</div>

<h2>Create New Account</h2>

<p>Fill in your details to get started</p>

</div>

<div class="top-image">

<img src="images/books.png" alt="">

</div>

</div>

<form>

<div class="row">

<div class="col-md-6 mb-3">

<label>Full Name</label>

<input type="text" class="form-control" placeholder="Enter your full name">

</div>

<div class="col-md-6 mb-3">

<label>Password</label>

<input type="password" class="form-control" placeholder="Enter your password">

</div>

<div class="col-md-6 mb-3">

<label>Email Address</label>

<input type="email" class="form-control" placeholder="Enter your email">

</div>

<div class="col-md-6 mb-3 position-relative">

<label>Confirm Password</label>

<input type="password" class="form-control" placeholder="Confirm your password">

<i class="bi bi-eye eye-icon"></i>

</div>

<div class="col-md-6 mb-3">

<label>Phone Number</label>

<input type="text" class="form-control" placeholder="Enter your phone number">

</div>

<div class="col-md-6 mb-3">

<label>Student ID (Optional)</label>

<input type="text" class="form-control" placeholder="Enter your student ID">

</div>

<div class="col-md-6 d-flex align-items-center">

<div class="form-check">

<input class="form-check-input" type="checkbox">

<label class="form-check-label">

I agree to the
<a href="#">Terms & Conditions</a>

</label>

</div>

</div>

<div class="col-md-6 mb-4">

<label>Department</label>

<select class="form-select">

<option selected>Select department</option>

<option>Computer Science</option>

<option>Software Engineering</option>

<option>Business</option>

<option>Education</option>

</select>

</div>

</div>

<div class="d-flex justify-content-center">
    <button class="animated-button" type="submit">
        <svg viewBox="0 0 24 24" class="arr-2" xmlns="http://www.w3.org/2000/svg">
            <path
                d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z">
            </path>
        </svg>

        <span class="text">Ragister</span>
        <span class="circle"></span>

        <svg viewBox="0 0 24 24" class="arr-1" xmlns="http://www.w3.org/2000/svg">
            <path
                d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z">
            </path>
        </svg>
    </button>
</div>

</form>

<p class="login-text mt-4">

Already have an account?

<a href="./login.html">Login here</a>

</p>

</div>

</div>

</section>
  <!-- bootstrape js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <!-- custom js -->
    <script src="./index.js"></script>

</body>

</html>
