    <section class="register-section">
      <div class="container">
        <div class="register-card slide-left">
          <div
            class="d-flex justify-content-between align-items-start flex-wrap mb-4"
          >
            <div>
              <div class="brand">
                <img
                  src="../images/logo1.png"
                  alt="LibraX Logo"
                  class="logo-img"
                />
              </div>

              <h2>Create New Account</h2>

              <p>Fill in your details to get started</p>
            </div>

            <div class="top-image">
              <img src="images/books.png" alt="" />
            </div>
          </div>

          <form id="registerForm">
            <div class="row">
              <div class="col-md-6 mb-3 scroll-fade">
                <label>Full Name</label>

                <input
                  type="text"
                  class="form-control"
                  placeholder="Enter your full name"
                  id="name"
                />
              </div>

              <div class="col-md-6 mb-3 scroll-fade">
                <label>Email Address</label>

                <input
                  type="email"
                  class="form-control"
                  placeholder="Enter your email"
                  id="email"
                />
              </div>
              <div class="col-md-6 mb-3 scroll-fade">
                <label>Password</label>

                <input
                  type="password"
                  class="form-control"
                  placeholder="Enter your password"
                  id="password"
                />
              </div>

              <div class="col-md-6 mb-3 position-relative scroll-fade">
                <label>Confirm Password</label>

                <input
                  type="password"
                  class="form-control"
                  placeholder="Confirm your password"
                />

                <i class="bi bi-eye eye-icon"></i>
              </div>

              <div class="col-md-6 mb-3 scroll-fade">
                <label>Phone Number</label>

                <input
                  type="text"
                  class="form-control"
                  placeholder="Enter your phone number"
                  id="contact"
                />
              </div>

              <div class="col-md-6 mb-3 scroll-fade">
                <label>Student ID (Optional)</label>

                <input
                  type="text"
                  class="form-control"
                  placeholder="Enter your student ID"
                />
              </div>
              <div class="col-md-6 mb-3 scroll-fade">
                <label>User Role</label>
                <select class="form-select" id="role" required>
                  <option value="">Select your role</option>
                  <option value="admin">Admin (Librarian)</option>
                  <option value="member">Member (Student)</option>
                </select>
              </div>

              <div class="col-md-6 d-flex align-items-center">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" />

                  <label class="form-check-label scroll-fade">
                    I agree to the
                    <a href="#">Terms & Conditions</a>
                  </label>
                </div>
              </div>

              <div class="col-md-6 mb-3 scroll-fade">
                <label>Department</label>
                <select class="form-select" id="registerDepartment">
                  <option selected>Select department</option>
                  <option value="">All Categories</option>
                  <option value="fiction">Fiction</option>
                  <option value="non-fiction">Non-Fiction</option>
                  <option value="programming">Programming</option>
                  <option value="science">Science</option>
                  <option value="business">Business</option>
                  <option value="islamic">Islamic</option>
                  <option value="history">History</option>
                  <option value="biography">Biography</option>
                  <option value="children">Children</option>
                </select>
              </div>
            </div>

            <div class="d-flex justify-content-center">
              <div class="d-flex justify-content-center">
                <button type="submit" class="animated-button nav-btn">
                  <svg
                    viewBox="0 0 24 24"
                    class="arr-2"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"
                    />
                  </svg>

                  <span class="btn-text">Ragister</span>

                  <span class="circle"></span>

                  <svg
                    viewBox="0 0 24 24"
                    class="arr-1"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L12.2218 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"
                    />
                  </svg>
                </button>
              </div>
            </div>
          </form>

          <p class="login-text mt-4">
            Already have an account?

            <a href="./login.html">Login here</a>
          </p>
        </div>
      </div>
    </section>
