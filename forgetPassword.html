<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password LibraX</title>

    <!-- bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- custom css -->
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>

  <body>
    <nav
      class="navbar navbar-expand-lg bg-body-tertiary navigation position-fixed z-1 w-100"
    >
      <div class="container-xxl">
        <a class="navbar-brand" href="#">
          <img style="width: 170px" src="./images/logo1.png" />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item pad">
              <a class="nav-link custom-nav-link" href="#">Home</a>
            </li>
            <li class="nav-item pad">
              <a class="nav-link custom-nav-link" href="./about.html">About</a>
            </li>
            <li class="nav-item pad">
              <a class="nav-link custom-nav-link" href="./feature.html"
                >Features</a
              >
            </li>
            <li class="nav-item pad">
              <a class="nav-link custom-nav-link" href="./html/admin/books.html"
                >Books</a
              >
            </li>
            <li class="nav-item pad">
              <a class="nav-link custom-nav-link" href="./contact.html"
                >Contact</a
              >
            </li>
            <li class="nav-item pad ms-lg-3">
              <button
                class="animated-button"
                type="button"
                onclick="window.location.href = './login.html'"
              >
                <svg
                  viewBox="0 0 24 24"
                  class="arr-2"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"
                  />
                </svg>

                <span class="text">Login</span>
                <span class="circle"></span>

                <svg
                  viewBox="0 0 24 24"
                  class="arr-1"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"
                  />
                </svg>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <section class="container-xxl forgot-section">
      <div class="container">
        <div class="row forgot-card align-items-center">
          <!-- Left Side -->

          <div class="col-lg-6">
            <div class="forgot-box">
              <div class="brand">
                <img
                  src="../images/logo1.png"
                  alt="LibraX Logo"
                  class="logo-img"
                />
              </div>

              <h2>Forgot Password?</h2>

              <p class="py-3">
                Don't worry! Enter your registered email address and we'll send
                you a password reset link.
              </p>

              <form>
                <div class="mb-4">
                  <label>Email Address</label>

                  <input
                    type="email"
                    class="form-control"
                    placeholder="Enter your email"
                  />
                </div>
                <!-- ========button start=============  -->
                <div class="d-flex justify-content-center">
                  <button class="animated-button" type="submit">
                    <svg
                      viewBox="0 0 24 24"
                      class="arr-2"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path
                        d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"
                      ></path>
                    </svg>

                    <span class="text">Send Reset Link</span>
                    <span class="circle"></span>

                    <svg
                      viewBox="0 0 24 24"
                      class="arr-1"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path
                        d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"
                      ></path>
                    </svg>
                  </button>
                </div>
                <!-- ========button end=============  -->
              </form>

              <div class="text-center mt-4">
                <a href="login.html">
                  <i class="bi bi-arrow-left"></i>
                  Back to Login
                </a>
              </div>
            </div>
          </div>

          <!-- Right Side -->

          <div class="col-lg-6 d-none d-lg-block">
            <div class="image-box">
              <img
                style="opacity: 1"
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT-mi18eyxOQQM0hoYC-xYRMxoiY0eHyr9heTOesEa3TjtmsjfVUL5HbGQc&s=10"
                alt=""
              />
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- bootstrape js -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
    <!-- custom js -->
    <script src="./index.js"></script>
  </body>
</html>
